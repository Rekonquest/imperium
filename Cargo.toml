[workspace]
resolver = "2"
members = [
    "crates/imperium-bus",
    "crates/imperium-protocol",
    "crates/imperium-store",
    "crates/imperium-runtime",
    "crates/imperium-secrets-vault",
    "crates/imperium-secrets-broker",
    "crates/imperium-secrets-threshold",
    "crates/imperium-secrets-audit",
    "crates/imperium-memory-log",
    "crates/imperium-memory-projection",
    "crates/imperium-managed-process",
    "crates/imperium-net-crypto",
    "crates/imperium-net-mesh",
    "crates/imperium-net-cluster",
    "crates/imperium-net-transport",
    "crates/imperium-net-strainer",
    "crates/imperium-net-sensors",
    "crates/imperium-net-signatures",
    "crates/imperium-net-toolkit",
    "crates/imperium-cli",
]
exclude = ["reference"]

[workspace.package]
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
authors = ["Lucerna Labs"]

[workspace.dependencies]
tokio = { version = "1", features = ["full", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"

# Cryptography — classical
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hkdf = "0.12"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rand = "0.8"

# Cryptography — post-quantum
ml-kem = "0.2"
ml-dsa = "0.1.0-rc.11"

# Signature matching
yara-x = "1.16.0"

# CLI
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
